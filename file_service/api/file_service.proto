syntax = "proto3";

package file.v1;

option go_package = "pkg/api";

import "google/protobuf/timestamp.proto";

service FileService {
  // Инициализация загрузки файла: создаёт запись и возвращает временную ссылку
  rpc InitUpload(InitUploadRequest) returns (InitUploadResponse);

  // Получение временной ссылки на скачивание файла
  rpc GenerateDownloadURL(GenerateDownloadURLRequest) returns (DownloadURL);

  // Получение метаданных файла
  rpc GetFileMeta(GetFileMetaRequest) returns (File);

  // Подтверждение, что клиент завершил загрузку по signed URL
  rpc ConfirmUpload(ConfirmUploadRequest) returns (File);

  // Internal cleanup: удалить неподтвержденные загрузки старше cutoff
  rpc CleanupOrphanUploads(CleanupOrphanUploadsRequest) returns (CleanupOrphanUploadsResponse);
}

// ==== INIT UPLOAD ====

message InitUploadRequest {
  string uploaded_by = 1;      // user_id
  string filename = 2;        // имя файла (например: homework.pdf)
}

message InitUploadResponse {
  string file_id = 1;
  string upload_url = 2;
  string method = 3;
}

// ==== DOWNLOAD ====

message GenerateDownloadURLRequest {
  string file_id = 1;
}

message DownloadURL {
  string url = 1;
}

// ==== GET FILE ====

message GetFileMetaRequest {
  string file_id = 1;
}

message ConfirmUploadRequest {
  string file_id = 1;
}

message CleanupOrphanUploadsRequest {
  google.protobuf.Timestamp older_than = 1;
}

message CleanupOrphanUploadsResponse {
  int32 deleted_count = 1;
}

message File {
  string id = 1;
  string extension = 2;
  string uploaded_by = 3;
  optional string filename = 4;
  google.protobuf.Timestamp created_at = 5;
  bool is_uploaded = 6;
}
