syntax = "proto3";

package payment.v1;

option go_package = "payment_service/proto";

import "google/protobuf/timestamp.proto";

service PaymentService {
  rpc GetPaymentInfo(GetPaymentInfoRequest) returns (PaymentInfo);
  rpc SubmitPaymentReceipt(SubmitPaymentReceiptRequest) returns (Receipt);
  rpc GetReceipt(GetReceiptRequest) returns (Receipt);
  rpc VerifyReceipt(VerifyReceiptRequest) returns (Receipt);
  rpc GetReceiptFile(GetReceiptFileRequest) returns (ReceiptFileURL);
  rpc ListReceipts(ListReceiptsRequest) returns (ListReceiptsResponse);
  rpc GetTutorAnalytics(GetTutorAnalyticsRequest) returns (TutorAnalytics);
}

// ==== REQUESTS ====

message GetPaymentInfoRequest {
  optional string lesson_id = 1;
}

message SubmitPaymentReceiptRequest {
  optional string lesson_id = 1;
  optional string file_id = 2; // чек (file_service.files.id)
}

message GetReceiptRequest {
  string receipt_id = 1;
}

message VerifyReceiptRequest {
  string receipt_id = 1;
}

message GetReceiptFileRequest {
  string receipt_id = 1;
}

// Exactly one of tutor_id or student_id must be set.
message ListReceiptsRequest {
  optional string tutor_id   = 1;
  optional string student_id = 2;
  optional int32 page = 3;
  optional int32 page_size = 4;
}

message GetTutorAnalyticsRequest {
  string tutor_id = 1;
  optional google.protobuf.Timestamp from = 2;
  optional google.protobuf.Timestamp to = 3;
}


// ==== RESPONSES ====

message PaymentInfo {
  optional string lesson_id = 1;
  optional int32 price_rub = 2;
  optional string payment_info = 3;
}

message Receipt {
  string id = 1;                 // UUIDv7
  optional string lesson_id = 2;          // Refers to schedule.lessons.id
  optional string file_id = 3;            // Refers to file_service.files.id
  bool is_verified = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp edited_at = 6;
  optional int32 price_rub = 7;
}

message ReceiptFileURL {
  optional string url = 1; // временная ссылка на файл из file-service
}

message ListReceiptsResponse {
  repeated Receipt receipts = 1;
  int32 page = 2;
  int64 total_count = 3;
}

message TutorAnalytics {
  string tutor_id = 1;
  optional google.protobuf.Timestamp from = 2;
  optional google.protobuf.Timestamp to = 3;
  int64 total_revenue_rub = 4;
  int64 completed_lessons_count = 5;
  int64 cancelled_lessons_count = 6;
  int64 active_students_count = 7;
  int64 unpaid_lessons_count = 8;
}
